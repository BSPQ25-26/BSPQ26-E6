name: Generate Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-documentation:
    name: Build tests, Maven Site, Doxygen HTML and PDF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: Football_Manager
        run: chmod +x mvnw

      - name: Run tests and generate JaCoCo report
        working-directory: Football_Manager
        run: ./mvnw clean test jacoco:report

      - name: Generate Maven Site
        working-directory: Football_Manager
        run: ./mvnw site

      - name: Install Doxygen, Graphviz and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            doxygen \
            graphviz \
            make \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-font-utils \
            cm-super

      - name: Generate Doxygen HTML and LaTeX documentation
        run: doxygen Doxyfile

      - name: Generate Doxygen PDF documentation
        working-directory: docs/doxygen/latex
        run: |
          make clean || true
          make
          test -f refman.pdf

      - name: Upload Maven Site artifact
        uses: actions/upload-artifact@v4
        with:
          name: maven-site
          path: Football_Manager/target/site/

      - name: Upload JaCoCo report artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: Football_Manager/target/site/jacoco/

      - name: Upload Doxygen HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: docs/doxygen/html/

      - name: Upload Doxygen PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-pdf
          path: docs/doxygen/latex/refman.pdf
          if-no-files-found: error