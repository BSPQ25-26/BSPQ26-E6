name: Generate Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-documentation:
    name: Build tests, Maven Site and Doxygen
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: Football_Manager
        run: chmod +x mvnw

      - name: Run tests and generate JaCoCo report
        working-directory: Football_Manager
        run: ./mvnw clean test jacoco:report

      - name: Generate Maven Site
        working-directory: Football_Manager
        run: ./mvnw site

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate Doxygen HTML documentation
        run: doxygen Doxyfile

      - name: Upload Maven Site artifact
        uses: actions/upload-artifact@v4
        with:
          name: maven-site
          path: Football_Manager/target/site/

      - name: Upload JaCoCo report artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: Football_Manager/target/site/jacoco/

      - name: Upload Doxygen HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: docs/doxygen/html/
