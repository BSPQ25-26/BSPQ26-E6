<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar(active)"
     class="bg-fm-surface/95 backdrop-blur border-b border-fm-border shadow-lg shadow-black/40 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16 gap-4">
            <a href="/teams" class="flex items-center gap-3 group">
                <span class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-fm-accent/15 ring-1 ring-fm-accent/40 group-hover:bg-fm-accent/25 transition-colors">
                    <svg class="w-5 h-5 text-fm-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path>
                    </svg>
                </span>
                <span class="text-lg font-black text-white uppercase tracking-wider">
                    Football<span class="text-fm-accent">Manager</span>
                </span>
            </a>

            <div class="flex flex-wrap gap-2 items-center">
                <select id="langSelect"
                        class="px-3 py-2 bg-fm-surfaceElevated text-fm-text text-sm font-medium rounded-md border border-fm-border hover:border-fm-borderStrong transition-colors cursor-pointer [&>option]:bg-fm-surface [&>option]:text-fm-text"
                        onchange="window.location.href = window.location.pathname + '?lang=' + this.value;">
                    <option value="es" th:selected="${#locale.language == 'es'}" th:text="#{global.lang.es}">Espanol</option>
                    <option value="en" th:selected="${#locale.language == 'en'}" th:text="#{global.lang.en}">English</option>
                </select>

                <a href="/teams"
                   th:classappend="${active == 'teams'} ? 'bg-fm-accent/10 text-fm-accent border-fm-accent/40' : 'bg-fm-surfaceElevated text-fm-textMuted border-fm-border hover:text-white hover:bg-fm-surfaceHover'"
                   class="px-3 py-2 text-sm font-semibold rounded-md border transition-colors"
                   th:text="#{nav.teams}">Teams</a>

                <a href="/standings"
                   th:classappend="${active == 'standings'} ? 'bg-fm-accent/10 text-fm-accent border-fm-accent/40' : 'bg-fm-surfaceElevated text-fm-textMuted border-fm-border hover:text-white hover:bg-fm-surfaceHover'"
                   class="px-3 py-2 text-sm font-semibold rounded-md border transition-colors"
                   th:text="#{nav.standings}">Standings</a>

                <a href="/profile"
                   th:classappend="${active == 'profile'} ? 'bg-fm-accent/10 text-fm-accent border-fm-accent/40' : 'bg-fm-surfaceElevated text-fm-textMuted border-fm-border hover:text-white hover:bg-fm-surfaceHover'"
                   class="px-3 py-2 text-sm font-semibold rounded-md border transition-colors"
                   th:text="#{nav.profile}">My Profile</a>

                <a th:if="${isAdmin}" href="/admin"
                   th:classappend="${active == 'admin'} ? 'bg-fm-accent/10 text-fm-accent border-fm-accent/40' : 'bg-fm-surfaceElevated text-fm-textMuted border-fm-border hover:text-white hover:bg-fm-surfaceHover'"
                   class="px-3 py-2 text-sm font-semibold rounded-md border transition-colors"
                   th:text="#{nav.adminPanel}">Admin Panel</a>

                <form th:action="@{/logout}" method="POST" class="m-0">
                    <button type="submit"
                            class="px-3 py-2 bg-rose-500/10 text-rose-400 text-sm font-semibold rounded-md hover:bg-rose-500 hover:text-white transition-colors border border-rose-500/30"
                            th:text="#{nav.logout}">Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
