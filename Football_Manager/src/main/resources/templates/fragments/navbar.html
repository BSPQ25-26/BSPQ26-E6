<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar(active)"
     class="bg-slate-900 border-b-2 border-emerald-600 shadow-md sticky top-0 z-40"
     th:classappend="${active == 'admin'} ? ' mb-10' : ''">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col sm:flex-row justify-between items-center min-h-16 py-3 gap-4">
            <a href="/teams" class="flex items-center gap-3">
                <svg class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path>
                </svg>
                <span class="text-xl font-black text-white uppercase tracking-wider">
                    Football<span class="text-emerald-500">Manager</span>
                </span>
            </a>

            <div class="flex flex-wrap justify-center sm:justify-end gap-3 items-center">
                <select id="langSelect"
                        class="px-4 py-[0.55rem] bg-slate-800 text-slate-300 text-sm font-medium rounded-md border border-slate-700"
                        onchange="window.location.href = window.location.pathname + '?lang=' + this.value;">
                    <option value="es" th:selected="${#locale.language == 'es'}" th:text="#{global.lang.es}">Espanol</option>
                    <option value="en" th:selected="${#locale.language == 'en'}" th:text="#{global.lang.en}">English</option>
                </select>

                <a href="/teams"
                   th:classappend="${active == 'teams'} ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700 hover:text-white'"
                   class="px-4 py-2 text-sm font-medium rounded-md border transition-colors"
                   th:text="#{nav.teams}">Teams</a>

                <a href="/standings"
                   th:classappend="${active == 'standings'} ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700 hover:text-white'"
                   class="px-4 py-2 text-sm font-medium rounded-md border transition-colors"
                   th:text="#{nav.standings}">Standings</a>

                <a href="/matches"
                   th:classappend="${active == 'matches'} ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700 hover:text-white'"
                   class="px-4 py-2 text-sm font-medium rounded-md border transition-colors"
                   th:text="#{nav.matches}">Matches</a>

                <a href="/profile"
                   th:classappend="${active == 'profile'} ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700 hover:text-white'"
                   class="px-4 py-2 text-sm font-medium rounded-md border transition-colors"
                   th:text="#{nav.profile}">My Profile</a>

                <a th:if="${isAdmin} or ${active == 'admin'}" href="/admin"
                   th:classappend="${active == 'admin'} ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700 hover:text-white'"
                   class="px-4 py-2 text-sm font-medium rounded-md border transition-colors"
                   th:text="#{nav.adminPanel}">Admin Panel</a>

                <form th:action="@{/logout}" method="POST" class="m-0">
                    <button type="submit"
                            class="px-4 py-2 bg-red-500/10 text-red-500 text-sm font-medium rounded-md hover:bg-red-500 hover:text-white transition-colors border border-red-500/20"
                            th:text="#{nav.logout}">Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
