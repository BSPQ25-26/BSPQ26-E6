<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Football Manager</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;700;800;900&family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        window.tailwind = window.tailwind || {};
        window.tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fm: {
                            bg: '#0A0A0B',
                            surface: '#0F172A',
                            surfaceElevated: '#1E293B',
                            surfaceHover: '#243042',
                            border: '#1F2937',
                            borderStrong: '#334155',
                            text: '#E2E8F0',
                            textMuted: '#94A3B8',
                            textSubtle: '#64748B',
                            accent: '#10B981',
                            accentHover: '#34D399',
                            accentMuted: '#064E3B',
                            danger: '#F43F5E',
                            warning: '#F59E0B'
                        }
                    },
                    fontFamily: {
                        sans: ['"Fira Sans"', 'system-ui', 'sans-serif'],
                        mono: ['"Fira Code"', 'ui-monospace', 'monospace']
                    },
                    boxShadow: {
                        'glow-accent': '0 0 0 3px rgba(16,185,129,.25)',
                        'glow-danger': '0 0 0 3px rgba(244,63,94,.25)'
                    }
                }
            }
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --fm-bg: #0A0A0B;
            --fm-surface: #0F172A;
            --fm-surface-elevated: #1E293B;
            --fm-surface-hover: #243042;
            --fm-border: #1F2937;
            --fm-border-strong: #334155;
            --fm-text: #E2E8F0;
            --fm-text-muted: #94A3B8;
            --fm-text-subtle: #64748B;
            --fm-accent: #10B981;
            --fm-accent-hover: #34D399;
            --fm-danger: #F43F5E;
        }

        html { color-scheme: dark; }
        body { background-color: var(--fm-bg); color: var(--fm-text); }

        .pitch-bg {
            background-color: var(--fm-bg);
            background-image:
                radial-gradient(ellipse 80% 50% at 50% 0%, rgba(16,185,129,0.10), transparent 60%),
                radial-gradient(ellipse 100% 60% at 50% 100%, rgba(30,41,59,0.55), transparent 70%),
                url('data:image/svg+xml,%3Csvg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="none" fill-rule="evenodd"%3E%3Cg fill="%231F2937" fill-opacity="0.35"%3E%3Cpath d="M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z"/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');
        }

        *:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(16,185,129,.35);
            border-radius: 6px;
        }

        .num {
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
            font-family: 'Fira Code', ui-monospace, monospace;
        }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #0A0A0B; }
        ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
</html>
