<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="${team.name + ' - ' + #messages.msg('app.name')}">Team Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen font-sans text-slate-800">

<nav th:replace="~{fragments/navbar :: navbar(active='teams')}"></nav>

<main class="max-w-6xl mx-auto px-4 py-10">

    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 mb-8">
        <div class="flex flex-col md:flex-row items-center gap-6">
            <div class="w-28 h-28 bg-slate-50 rounded-2xl border p-3 flex items-center justify-center">
                <img th:src="${team.logoUrl != null && !team.logoUrl.isEmpty() ? team.logoUrl : 'https://via.placeholder.com/150?text=Logo'}"
                     class="w-full h-full object-contain"
                     th:alt="#{teamDetails.teamLogoAlt}">
            </div>

            <div class="text-center md:text-left">
                <h1 class="text-4xl font-extrabold uppercase text-slate-900" th:text="${team.name}">
                    Team Name
                </h1>

                <p class="text-slate-500 mt-2 font-medium"
                   th:text="${team.country != null ? team.country.name : #messages.msg('teamDetails.country.unknown')}">
                    Country
                </p>
            </div>
        </div>
    </section>

    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-6">
            <div>
                <h2 class="text-2xl font-extrabold text-slate-900 uppercase" th:text="#{teamDetails.squad}">
                    Squad
                </h2>
                <p class="text-slate-500 mt-1 font-medium" th:text="#{teamDetails.squad.subtitle}">
                    Current registered players for this team.
                </p>
            </div>
            <div class="inline-flex items-center rounded-full bg-emerald-50 px-4 py-2 text-sm font-bold text-emerald-700 border border-emerald-100"
                 th:text="#{teamDetails.squad.count(${#lists.size(players)})}">
                0 players
            </div>
        </div>

        <div th:if="${#lists.isEmpty(players)}" class="text-slate-500" th:text="#{teamDetails.squad.empty}">
            No players registered for this team yet.
        </div>

        <div th:if="${!#lists.isEmpty(players)}" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
            <article th:each="player : ${players}"
                     class="rounded-2xl border border-slate-200 bg-slate-50 p-5 hover:border-emerald-200 hover:bg-emerald-50/40 transition-colors">
                <div class="flex items-start justify-between gap-4">
                    <div class="min-w-0">
                        <h3 class="text-lg font-extrabold text-slate-900 truncate" th:text="${player.name}">
                            Player Name
                        </h3>
                        <p class="mt-2 inline-flex items-center rounded-full bg-white px-3 py-1 text-xs font-bold uppercase tracking-wide text-slate-600 border border-slate-200"
                           th:text="${#messages.msgOrNull('playerPosition.' + player.position.name()) != null ? #messages.msgOrNull('playerPosition.' + player.position.name()) : player.position.name()}">
                            Forward
                        </p>
                    </div>

                    <div class="flex-shrink-0 w-14 h-14 rounded-2xl bg-emerald-600 text-white flex items-center justify-center shadow-md shadow-emerald-600/20">
                        <span class="text-2xl font-black leading-none" th:text="${player.number}">9</span>
                    </div>
                </div>
            </article>
        </div>
    </section>

    <section class="grid grid-cols-1 lg:grid-cols-2 gap-8">

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h2 class="text-2xl font-extrabold text-slate-900 uppercase mb-4" th:text="#{teamDetails.recent}">
                Recent Matches
            </h2>

            <div th:if="${#lists.isEmpty(recentMatches)}" class="text-slate-500" th:text="#{teamDetails.recent.empty}">
                No recent matches for this team.
            </div>

            <div th:if="${!#lists.isEmpty(recentMatches)}" class="space-y-4">
                <div th:each="match : ${recentMatches}"
                     class="border border-slate-200 rounded-xl p-4 bg-slate-50">

                    <div class="flex justify-between items-center gap-4">
                        <div class="font-bold text-slate-900"
                             th:text="${match.leftTeam != null ? match.leftTeam.name : #messages.msg('teamDetails.home')}">
                            Home
                        </div>

                        <div class="text-xl font-black text-emerald-600"
                             th:text="${match.leftScore + ' - ' + match.rightScore}">
                            0 - 0
                        </div>

                        <div class="font-bold text-slate-900 text-right"
                             th:text="${match.rightTeam != null ? match.rightTeam.name : #messages.msg('teamDetails.away')}">
                            Away
                        </div>
                    </div>

                    <div class="text-sm text-slate-500 mt-2 text-center"
                         th:text="${#temporals.format(match.datetime, 'dd MMM yyyy HH:mm')}">
                        Date
                    </div>

                    <div class="text-sm text-slate-500 mt-1 text-center"
                         th:text="${match.venue}">
                        Venue
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h2 class="text-2xl font-extrabold text-slate-900 uppercase mb-4" th:text="#{teamDetails.future}">
                Future Matches
            </h2>

            <div th:if="${#lists.isEmpty(futureMatches)}" class="text-slate-500" th:text="#{teamDetails.future.empty}">
                No future matches for this team.
            </div>

            <div th:if="${!#lists.isEmpty(futureMatches)}" class="space-y-4">
                <div th:each="match : ${futureMatches}"
                     class="border border-slate-200 rounded-xl p-4 bg-slate-50">

                    <div class="flex justify-between items-center gap-4">
                        <div class="font-bold text-slate-900"
                             th:text="${match.leftTeam != null ? match.leftTeam.name : #messages.msg('teamDetails.home')}">
                            Home
                        </div>

                        <div class="text-sm font-black text-slate-500 uppercase" th:text="#{teamDetails.vs}">
                            VS
                        </div>

                        <div class="font-bold text-slate-900 text-right"
                             th:text="${match.rightTeam != null ? match.rightTeam.name : #messages.msg('teamDetails.away')}">
                            Away
                        </div>
                    </div>

                    <div class="text-sm text-slate-500 mt-2 text-center"
                         th:text="${#temporals.format(match.datetime, 'dd MMM yyyy HH:mm')}">
                        Date
                    </div>

                    <div class="text-sm text-slate-500 mt-1 text-center"
                         th:text="${match.venue}">
                        Venue
                    </div>
                </div>
            </div>
        </div>

    </section>
</main>

</body>
</html>
