<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{scheduleMatch.title}">Football Manager - Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pitch-bg {
            background-color: #f8fafc;
            background-image: url('data:image/svg+xml,%3Csvg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="none" fill-rule="evenodd"%3E%3Cg fill="%23e2e8f0" fill-opacity="0.4"%3E%3Cpath d="M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z"/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');
        }
    </style>
</head>

<body class="pitch-bg min-h-screen font-sans text-slate-800 pb-10">

<nav th:replace="~{fragments/navbar :: navbar(active='matches-schedule')}"></nav>

<div class="max-w-lg mx-auto bg-white p-8 rounded-lg shadow border border-slate-200">
    <h2 class="text-2xl font-bold mb-6 text-slate-900" th:text="#{scheduleMatch.heading}">Schedule New Match</h2>

    <form th:action="@{/api/matches}" th:object="${matchRequest}" method="POST" class="space-y-4">

        <div>
            <label class="block text-sm font-medium text-slate-700" th:text="#{scheduleMatch.homeTeam}">Home Team</label>
            <select th:field="*{homeTeamId}" class="w-full border p-2 rounded" required>
                <option value="" disabled selected th:text="#{scheduleMatch.selectHome}">Select home team</option>
                <option th:each="team : ${teams}" th:value="${team.id}" th:text="${team.name}"></option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700" th:text="#{scheduleMatch.awayTeam}">Away Team</label>
            <select th:field="*{awayTeamId}" class="w-full border p-2 rounded" required>
                <option value="" disabled selected th:text="#{scheduleMatch.selectAway}">Select away team</option>
                <option th:each="team : ${teams}" th:value="${team.id}" th:text="${team.name}"></option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700" th:text="#{scheduleMatch.competitionId}">Competition ID</label>
            <input type="number" th:field="*{competitionId}" class="w-full border p-2 rounded" required>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700" th:text="#{scheduleMatch.kickoff}">Kickoff Time</label>
            <input type="datetime-local" th:field="*{kickoffTime}" class="w-full border p-2 rounded" required>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700" th:text="#{scheduleMatch.venue}">Venue</label>
            <input type="text" th:field="*{venue}" class="w-full border p-2 rounded" required>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700" th:text="#{scheduleMatch.status}">Status</label>
            <select th:field="*{status}" class="w-full border p-2 rounded">
                <option th:each="st : ${T(com.example.football_manager.dto.MatchRequestDTO.MatchStatus).values()}"
                        th:value="${st}" th:text="${st}">
                </option>
            </select>
        </div>

        <button type="submit"
                class="w-full bg-emerald-600 text-white py-2 rounded hover:bg-emerald-700 font-bold transition-colors" th:text="#{scheduleMatch.submit}">
            Schedule Match
        </button>
    </form>
</div>

</body>
</html>
