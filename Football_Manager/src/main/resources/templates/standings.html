<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{standings.title}">Football Manager - Standings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pitch-bg {
            background-color: #f8fafc;
            background-image: url('data:image/svg+xml,%3Csvg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="none" fill-rule="evenodd"%3E%3Cg fill="%23e2e8f0" fill-opacity="0.4"%3E%3Cpath d="M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z"/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');
        }
    </style>
</head>

<body class="pitch-bg min-h-screen font-sans text-slate-800">

<nav th:replace="~{fragments/navbar :: navbar(active='standings')}"></nav>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

    <!-- Page heading card -->
    <div class="mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight uppercase" th:text="#{standings.heading}">League Standings</h1>
                <p class="text-slate-500 mt-1 font-medium" th:text="#{standings.subtitle}">
                    Current league table ordered by points. Goal difference is shown for tie-breaking context.
                </p>
            </div>

            <div th:if="${!#lists.isEmpty(competitions)}"
                 class="flex flex-col gap-1 md:min-w-[16rem]">
                <label for="leagueSelect"
                       class="text-xs font-bold uppercase tracking-wider text-slate-500"
                       th:text="#{standings.selectLeague}">League</label>
                <select id="leagueSelect"
                        class="px-4 py-2 bg-white text-slate-800 text-sm font-bold rounded-md border border-slate-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                        onchange="window.location.href = window.location.pathname + '?competitionId=' + this.value;">
                    <option th:each="c : ${competitions}"
                            th:value="${c.id}"
                            th:text="${c.name}"
                            th:selected="${c.id == selectedCompetitionId}">Competition name</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Standings table card -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">

        <!-- Empty state, in case the controller passes an empty list -->
        <div th:if="${#lists.isEmpty(standings)}" class="p-12 text-center">
            <h3 class="text-lg font-bold text-slate-900" th:text="#{standings.empty.title}">No standings available</h3>
            <p class="text-slate-500 mt-1" th:text="#{standings.empty.subtitle}">There are no teams to display yet.</p>
        </div>

        <!-- Table is wrapped in overflow-x-auto so it scrolls horizontally on small screens -->
        <div th:if="${!#lists.isEmpty(standings)}" class="overflow-x-auto">
            <table class="min-w-full divide-y divide-slate-200">
                <thead class="bg-slate-50">
                    <tr class="text-xs font-bold uppercase tracking-wider text-slate-500">
                        <th scope="col" class="px-4 py-3 text-left" th:text="#{standings.table.position}">#</th>
                        <th scope="col" class="px-4 py-3 text-left" th:text="#{standings.table.team}">Team</th>
                        <th scope="col" class="px-3 py-3 text-center" th:title="#{standings.table.played.full}" th:text="#{standings.table.played}">PJ</th>
                        <th scope="col" class="px-3 py-3 text-center" th:title="#{standings.table.won.full}" th:text="#{standings.table.won}">PG</th>
                        <th scope="col" class="px-3 py-3 text-center" th:title="#{standings.table.drawn.full}" th:text="#{standings.table.drawn}">PE</th>
                        <th scope="col" class="px-3 py-3 text-center" th:title="#{standings.table.lost.full}" th:text="#{standings.table.lost}">PP</th>
                        <th scope="col" class="px-3 py-3 text-center" th:title="#{standings.table.goalsFor.full}" th:text="#{standings.table.goalsFor}">GF</th>
                        <th scope="col" class="px-3 py-3 text-center" th:title="#{standings.table.goalsAgainst.full}" th:text="#{standings.table.goalsAgainst}">GC</th>
                        <th scope="col" class="px-3 py-3 text-center" th:title="#{standings.table.goalDifference.full}" th:text="#{standings.table.goalDifference}">DG</th>
                        <th scope="col" class="px-4 py-3 text-center text-emerald-700" th:title="#{standings.table.points.full}" th:text="#{standings.table.points}">PTS</th>
                    </tr>
                </thead>

                <tbody class="divide-y divide-slate-200 bg-white">
                    <!-- iterStat.count gives 1-based position, which matches the sorted order from the controller -->
                    <tr th:each="row, iterStat : ${standings}" class="hover:bg-emerald-50 transition-colors">

                        <!-- Position. First place gets a gold pill, the rest a neutral one -->
                        <td class="px-4 py-3 whitespace-nowrap">
                            <span th:if="${iterStat.count == 1}"
                                  class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-amber-100 text-amber-700 text-sm font-black"
                                  th:text="${iterStat.count}">1</span>
                            <span th:if="${iterStat.count != 1}"
                                  class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-slate-100 text-slate-700 text-sm font-bold"
                                  th:text="${iterStat.count}">2</span>
                        </td>

                        <!-- Team logo + name -->
                        <td class="px-4 py-3 whitespace-nowrap">
                            <div class="flex items-center gap-3">
                                <div class="flex-shrink-0 w-9 h-9 bg-slate-50 rounded-lg border border-slate-100 p-1 flex items-center justify-center">
                                    <img th:src="${row.logoUrl != null && !row.logoUrl.isEmpty() ? row.logoUrl : 'https://via.placeholder.com/64?text=Logo'}"
                                         th:alt="#{standings.teamLogoAlt}"
                                         class="w-full h-full object-contain">
                                </div>
                                <span class="font-bold text-slate-900 uppercase tracking-tight"
                                      th:text="${row.teamName}">Team Name</span>
                            </div>
                        </td>

                        <td class="px-3 py-3 text-center text-sm text-slate-700 font-medium" th:text="${row.matchesPlayed}">0</td>
                        <td class="px-3 py-3 text-center text-sm text-slate-700 font-medium" th:text="${row.won}">0</td>
                        <td class="px-3 py-3 text-center text-sm text-slate-700 font-medium" th:text="${row.drawn}">0</td>
                        <td class="px-3 py-3 text-center text-sm text-slate-700 font-medium" th:text="${row.lost}">0</td>
                        <td class="px-3 py-3 text-center text-sm text-slate-700 font-medium" th:text="${row.goalsFor}">0</td>
                        <td class="px-3 py-3 text-center text-sm text-slate-700 font-medium" th:text="${row.goalsAgainst}">0</td>

                        <!-- Goal difference colored by sign -->
                        <td class="px-3 py-3 text-center text-sm font-bold"
                            th:classappend="${row.goalDifference > 0} ? 'text-emerald-600' : (${row.goalDifference < 0} ? 'text-red-500' : 'text-slate-500')"
                            th:text="${row.goalDifference > 0} ? '+' + ${row.goalDifference} : ${row.goalDifference}">
                            0
                        </td>

                        <!-- Points, the primary sort key -->
                        <td class="px-4 py-3 text-center">
                            <span class="inline-flex items-center justify-center min-w-[2.5rem] px-2 py-1 rounded-md bg-emerald-50 text-emerald-700 text-sm font-black"
                                  th:text="${row.points}">0</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

</body>
</html>
