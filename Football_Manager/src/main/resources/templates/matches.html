<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{matches.title}">Football Manager - Match Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pitch-bg {
            background-color: #f8fafc;
            background-image: url('data:image/svg+xml,%3Csvg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="none" fill-rule="evenodd"%3E%3Cg fill="%23e2e8f0" fill-opacity="0.4"%3E%3Cpath d="M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z"/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');
        }
    </style>
</head>
<body class="pitch-bg min-h-screen font-sans text-slate-800">

<nav th:replace="~{fragments/navbar :: navbar(active='matches')}"></nav>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    
    <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-8 gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <div>
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight uppercase" th:text="#{matches.heading}">Match Schedule</h1>
            <p class="text-slate-500 mt-1 font-medium" th:text="#{matches.subtitle}">Track all upcoming fixtures and final results.</p>
        </div>
        <div class="flex flex-col sm:flex-row gap-3 w-full lg:w-auto">
            <label class="sr-only" for="matchTeamFilter" th:text="#{matches.filters.team}">Team</label>
            <select id="matchTeamFilter"
                    class="w-full sm:w-72 px-4 py-3 border border-slate-300 rounded-xl bg-slate-50 text-sm font-bold text-slate-700 focus:outline-none focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all">
                <option value="" th:selected="${selectedTeamId == null}" th:text="#{matches.filters.allTeams}">All teams</option>
                <option th:each="team : ${teams}"
                        th:value="${team.id}"
                        th:selected="${selectedTeamId != null and selectedTeamId == team.id}"
                        th:text="${team.name}">
                    Team
                </option>
            </select>
            <a th:if="${isAdmin}" href="/matches/schedule" class="px-6 py-3 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700 transition-all shadow-lg shadow-emerald-200 uppercase text-sm tracking-widest text-center" th:text="#{matches.scheduleNew}">
                Schedule New Match
            </a>
        </div>
    </div>

    <div id="matchesEmptyState"
         th:classappend="${#lists.isEmpty(matches)} ? '' : ' hidden'"
         class="bg-white p-12 rounded-2xl shadow-sm border border-slate-200 text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-100 text-slate-400 mb-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        </div>
        <h3 class="text-lg font-bold text-slate-900" th:text="#{matches.empty.title}">No matches scheduled</h3>
        <p class="text-slate-500 mt-1" th:text="#{matches.empty.subtitle}">Check back later or schedule a new game.</p>
    </div>

    <div id="matchesTableWrapper"
         th:classappend="${#lists.isEmpty(matches)} ? ' hidden' : ''"
         class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <table class="w-full text-left">
            <thead>
                <tr class="bg-slate-50 border-b border-slate-200">
                    <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider" th:text="#{matches.table.dateTime}">Date & Time</th>
                    <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider text-right" th:text="#{matches.table.home}">Home</th>
                    <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider text-center" th:text="#{matches.table.score}">Score</th>
                    <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider" th:text="#{matches.table.away}">Away</th>
                    <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider" th:text="#{matches.table.competition}">Competition</th>
                </tr>
            </thead>
            <tbody id="matchesTableBody" class="divide-y divide-slate-100">
                <tr th:each="match : ${matches}" class="hover:bg-emerald-50/30 transition-colors group">
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-bold text-slate-900" th:text="${#temporals.format(match.datetime, 'dd MMM yyyy')}"></div>
                        <div class="text-xs text-slate-500" th:text="${#temporals.format(match.datetime, 'HH:mm')}"></div>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <span class="text-sm font-black text-slate-700 uppercase" th:text="${match.leftTeam.name}">Home Team</span>
                    </td>
                    <td class="px-6 py-4 text-center">
                        <div class="inline-flex items-center px-3 py-1 rounded-lg bg-slate-900 text-emerald-400 font-mono font-bold shadow-inner">
                            <span th:text="${match.leftScore}">0</span>
                            <span class="mx-2 opacity-50">-</span>
                            <span th:text="${match.rightScore}">0</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-left">
                        <span class="text-sm font-black text-slate-700 uppercase" th:text="${match.rightTeam.name}">Away Team</span>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded" th:text="${match.competition.name}">Competition</span>
                            <span th:if="${match.finished}" class="text-[10px] uppercase font-black text-slate-400" th:text="#{matches.final}">FT</span>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', () => {
        const teamFilter = document.getElementById('matchTeamFilter');
        const tableWrapper = document.getElementById('matchesTableWrapper');
        const tableBody = document.getElementById('matchesTableBody');
        const emptyState = document.getElementById('matchesEmptyState');
        const locale = document.documentElement.lang || undefined;
        const dateFormatter = new Intl.DateTimeFormat(locale, {
            day: '2-digit',
            month: 'short',
            year: 'numeric'
        });
        const timeFormatter = new Intl.DateTimeFormat(locale, {
            hour: '2-digit',
            minute: '2-digit'
        });
        const messages = {
            final: /*[[#{matches.final}]]*/ 'FT',
            competitionPlaceholder: /*[[#{matches.competition.placeholder}]]*/ 'Competition',
            loadError: /*[[#{matches.filters.error}]]*/ 'Could not load matches.'
        };

        function appendCell(row, className) {
            const cell = document.createElement('td');
            cell.className = className;
            row.appendChild(cell);
            return cell;
        }

        function formatDateTime(value) {
            const date = new Date(value);

            if (Number.isNaN(date.getTime())) {
                return { date: '', time: '' };
            }

            return {
                date: dateFormatter.format(date),
                time: timeFormatter.format(date)
            };
        }

        function createTextElement(tagName, className, text) {
            const element = document.createElement(tagName);
            element.className = className;
            element.textContent = text || '';
            return element;
        }

        function createMatchRow(match) {
            const row = document.createElement('tr');
            row.className = 'hover:bg-emerald-50/30 transition-colors group';

            const dateCell = appendCell(row, 'px-6 py-4 whitespace-nowrap');
            const formattedDate = formatDateTime(match.datetime);
            dateCell.appendChild(createTextElement('div', 'text-sm font-bold text-slate-900', formattedDate.date));
            dateCell.appendChild(createTextElement('div', 'text-xs text-slate-500', formattedDate.time));

            const homeCell = appendCell(row, 'px-6 py-4 text-right');
            homeCell.appendChild(createTextElement(
                    'span',
                    'text-sm font-black text-slate-700 uppercase',
                    match.leftTeam?.name
            ));

            const scoreCell = appendCell(row, 'px-6 py-4 text-center');
            const scoreWrapper = document.createElement('div');
            scoreWrapper.className = 'inline-flex items-center px-3 py-1 rounded-lg bg-slate-900 text-emerald-400 font-mono font-bold shadow-inner';
            scoreWrapper.appendChild(createTextElement('span', '', String(match.leftScore ?? 0)));
            scoreWrapper.appendChild(createTextElement('span', 'mx-2 opacity-50', '-'));
            scoreWrapper.appendChild(createTextElement('span', '', String(match.rightScore ?? 0)));
            scoreCell.appendChild(scoreWrapper);

            const awayCell = appendCell(row, 'px-6 py-4 text-left');
            awayCell.appendChild(createTextElement(
                    'span',
                    'text-sm font-black text-slate-700 uppercase',
                    match.rightTeam?.name
            ));

            const competitionCell = appendCell(row, 'px-6 py-4');
            const competitionWrapper = document.createElement('div');
            competitionWrapper.className = 'flex items-center gap-2';
            competitionWrapper.appendChild(createTextElement(
                    'span',
                    'text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded',
                    match.competition?.name || messages.competitionPlaceholder
            ));

            if (match.finished) {
                competitionWrapper.appendChild(createTextElement(
                        'span',
                        'text-[10px] uppercase font-black text-slate-400',
                        messages.final
                ));
            }

            competitionCell.appendChild(competitionWrapper);

            return row;
        }

        function renderMatches(matches) {
            tableBody.replaceChildren();

            matches.forEach(match => {
                tableBody.appendChild(createMatchRow(match));
            });

            const hasMatches = matches.length > 0;
            tableWrapper.classList.toggle('hidden', !hasMatches);
            emptyState.classList.toggle('hidden', hasMatches);
        }

        async function loadMatches() {
            const params = new URLSearchParams(window.location.search);

            if (teamFilter.value) {
                params.set('teamId', teamFilter.value);
            } else {
                params.delete('teamId');
            }

            const query = params.toString();
            teamFilter.disabled = true;

            try {
                const response = await fetch(`/api/matches${query ? `?${query}` : ''}`);

                if (!response.ok) {
                    throw new Error('Request failed');
                }

                renderMatches(await response.json());
                window.history.replaceState(null, '', `${window.location.pathname}${query ? `?${query}` : ''}`);
            } catch (error) {
                window.alert(messages.loadError);
            } finally {
                teamFilter.disabled = false;
            }
        }

        if (teamFilter) {
            teamFilter.addEventListener('change', loadMatches);
        }
    });
</script>

</body>
</html>
